<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TM Web Hosting</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 92%;
      max-width: 430px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .google-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 28px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      color: #222;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn:hover {
      background: #f7f7f7;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>TM Web Hosting</h1>

    <p>
      Host your HTML websites easily.
      Sign in with your Google account to continue.
    </p>

    <a class="google-btn" href="/api/auth/google">
      Continue with Google
    </a>
  </div>

</body>
</html>
